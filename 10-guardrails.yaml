apiVersion: v1
kind: ResourceQuota
metadata:
  name: caramel-store-budget
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: store
spec:
  hard:
    requests.cpu: 750m
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 4Gi
    pods: "4"
    persistentvolumeclaims: "3"
    requests.storage: 50Gi
    services: "4"
    count/deployments.apps: "3"
    count/jobs.batch: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: caramel-store-container-defaults
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: store
spec:
  limits:
    - type: Container
      min:
        cpu: 5m
        memory: 32Mi
      max:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
