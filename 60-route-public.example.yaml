# Example only: apply after the catalog Deployment has ready endpoints.
# Keep the import endpoint separately protected by VPN, mTLS, or an equivalent
# access policy; do not make it public merely because it shares this hostname.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: caramel-store-public
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: store
    app.kubernetes.io/name: caramel-store
spec:
  host: caramel-vanilla-store.apps.radiosound.com
  path: /v1/catalog
  to:
    kind: Service
    name: caramel-store
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
