# Bearer-token-protected import endpoint. The route is intentionally public at
# the network layer for the MVP; the API must still reject every request that
# lacks the scoped Authorization: Bearer token.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: caramel-store-import
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: store
    app.kubernetes.io/name: caramel-store
spec:
  host: caramel-vanilla-store.apps.radiosound.com
  path: /v1/import
  to:
    kind: Service
    name: caramel-store
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
