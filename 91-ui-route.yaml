# The API's /v1/catalog and /v1/import Routes have longer paths and therefore
# win over this root Route for those requests. The browser remains same-origin
# with the API, so no CORS policy is required.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: caramel-store-ui
  namespace: caramel-store
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: store-ui
    app.kubernetes.io/name: caramel-store-ui
spec:
  host: caramel-vanilla-store.apps.radiosound.com
  to:
    kind: Service
    name: caramel-store-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
