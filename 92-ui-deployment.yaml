apiVersion: apps/v1
kind: Deployment
metadata:
  name: caramel-store-ui
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: store-ui
    app.kubernetes.io/name: caramel-store-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: caramel-store-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: caramel-vanilla
        app.kubernetes.io/component: store-ui
        app.kubernetes.io/name: caramel-store-ui
    spec:
      serviceAccountName: caramel-store
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          volumeMounts:
            - name: ui-assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: ui-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ui-assets
          configMap:
            name: caramel-store-ui-assets
            defaultMode: 0444
            items:
              - key: index.html
                path: index.html
              - key: app.js
                path: app.js
              - key: styles.css
                path: styles.css
        - name: ui-nginx-config
          configMap:
            name: caramel-store-ui-assets
            defaultMode: 0444
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
