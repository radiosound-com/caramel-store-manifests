apiVersion: v1
kind: ConfigMap
metadata:
  name: caramel-repository-rgw-ca
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: app-repository
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
data: {}
---
apiVersion: v1
kind: Service
metadata:
  name: caramel-app-repository
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: app-repository
    app.kubernetes.io/name: caramel-app-repository
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caramel-app-repository
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caramel-app-repository
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: app-repository
    app.kubernetes.io/name: caramel-app-repository
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: caramel-app-repository
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: caramel-vanilla
        app.kubernetes.io/component: app-repository
        app.kubernetes.io/name: caramel-app-repository
    spec:
      serviceAccountName: caramel-store
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: upstream-ca
              mountPath: /etc/nginx/upstream-ca
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: caramel-app-repository-config
            defaultMode: 0444
        - name: upstream-ca
          configMap:
            name: caramel-repository-rgw-ca
            defaultMode: 0444
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: caramel-app-repository
  namespace: caramel-store
  labels:
    app.kubernetes.io/part-of: caramel-vanilla
    app.kubernetes.io/component: app-repository
    app.kubernetes.io/name: caramel-app-repository
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
    haproxy.router.openshift.io/timeout: 5m
spec:
  host: caramel-vanilla-store.apps.radiosound.com
  path: /fdroid/repo
  to:
    kind: Service
    name: caramel-app-repository
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
