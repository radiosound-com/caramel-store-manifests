server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    location = /fdroid/repo {
        return 308 /fdroid/repo/;
    }

    location /fdroid/repo/ {
        proxy_pass https://rook-ceph-rgw-mrdata-updates.rook-ceph.svc:443/caramel-apps/fdroid/repo/;
        proxy_http_version 1.1;
        proxy_set_header Host rook-ceph-rgw-mrdata-updates.rook-ceph.svc;
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
        proxy_ssl_server_name on;
        proxy_ssl_name rook-ceph-rgw-mrdata-updates.rook-ceph.svc;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/upstream-ca/service-ca.crt;
        proxy_intercept_errors off;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        return 404;
    }
}
